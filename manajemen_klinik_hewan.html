try {
if (typeof google === 'undefined' || !google.script || !google.script.run) {
clearTimeout(timeout);
useLocalDB();
return;
}
google.script.run
.withSuccessHandler(res => {
clearTimeout(timeout);
try {
if (!res || res.status !== 'success') {
showFailsafe("Gagal memuat dari Spreadsheet: " + (res ? res.message : "Respons kosong dari server."));
return;
}

isLocal = false;

let parsedData = {};

D.sl    = parsedData.sl  || [];

D.lt    = parsedData.lt  || [];
D.pos   = parsedData.pos || [];

const maxInvNo = D.ap.reduce((max, a) => Math.max(max, parseInt(a.no) || 0), 0);
let hasWtKey = false;
let savedSeq = null;

if (parsedData.set && Array.isArray(parsedData.set)) {
parsedData.set.forEach(s => {
if (s.k === 'nm' && s.v) D.nm = s.v;
if (s.k === 'seq' && s.v) {
const n = parseInt(s.v);
if (!isNaN(n)) savedSeq = n;
}
if (s.k === 'wt') {
hasWtKey = true;
try { D.wt = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || []); }
catch(e) { D.wt = []; }
}
if (s.k === 'dc') {
try { D.dc = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || []); }
catch(e) { D.dc = []; }
}
if (s.k === 'cm') {
try { D.cm = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || {}); }
catch(e) { D.cm = {}; }
}
});
}

D.seq = Math.max(D.seq || 260, savedSeq || 0, maxInvNo + 1);

if (!hasWtKey && (!D.wt || D.wt.length === 0)) {
D.wt = [

];
}

const savedSession = _lsGet('vet_session');
if (savedSession) {
try {
const sessObj = JSON.parse(savedSession);
const validUser = D.users.find(u => String(u.u).trim() === String(sessObj.u).trim() && String(u.p) === String(sessObj.p));
if (validUser) { D.U = validUser; D.pg = PM[D.U.r][0]; }
else { _lsDel('vet_session'); }
} catch(e) {}
}

_lastJSON = {
users: JSON.stringify(D.users),
cl: JSON.stringify(D.cl),
ap: JSON.stringify(D.ap),
sl: JSON.stringify(D.sl),
ex: JSON.stringify(D.ex),
ct: JSON.stringify(D.ct),
md: JSON.stringify(D.md),
lt: JSON.stringify(D.lt),
pos: JSON.stringify(D.pos),
set: JSON.stringify([
{k:'nm', v:D.nm},
{k:'wt', v:JSON.stringify(D.wt || [])},
{k:'dc', v:JSON.stringify(D.dc || [])},
{k:'cm', v:JSON.stringify(D.cm || {})},

])

_syncInFlight = false;

}
})

showFailsafe("Terputus dari jaringan Google: " + (err && err.message ? err.message : err));
})
.loadData();
} catch (e) {
clearTimeout(timeout);
showFailsafe(e.message || "Tidak berjalan di server Google Apps Script.");
}

ct: D.ct, md: D.md, lt: D.lt, pos: D.pos
};
const payload = {};
for (const k in sheetMap) {
const j = JSON.stringify(sheetMap[k]);
if (_lastJSON[k] !== j) payload[k] = sheetMap[k];
}
if (_lastJSON.set !== JSON.stringify(setArr)) payload.set = setArr;
return payload;
}

function _updateLastJSONFromRemote(data) {
_lastJSON = {
users: JSON.stringify(data.users || []),
cl:    JSON.stringify(data.cl    || []),
ap:    JSON.stringify(data.ap    || []),
sl:    JSON.stringify(data.sl    || []),
ex:    JSON.stringify(data.ex    || []),
ct:    JSON.stringify(data.ct    || []),
md:    JSON.stringify(data.md    || []),
lt:    JSON.stringify(data.lt    || []),
pos:   JSON.stringify(data.pos   || [])
};
var sNm = '', sWt = [], sDc = [], sCm = {}, sSeq = 0;
(data.set || []).forEach(function(s) {
if (s.k === 'nm' && s.v) sNm = s.v;
if (s.k === 'wt') { try { sWt = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || []); } catch(e) {} }
if (s.k === 'dc') { try { sDc = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || []); } catch(e) {} }
if (s.k === 'cm') { try { sCm = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || {}); } catch(e) {} }
if (s.k === 'seq') sSeq = parseInt(s.v) || 0;
});
_lastJSON.set = JSON.stringify([
{k:'nm', v: sNm},
{k:'wt', v: JSON.stringify(sWt)},
{k:'dc', v: JSON.stringify(sDc)},
{k:'cm', v: JSON.stringify(sCm)},
{k:'seq', v: String(sSeq)}
]);
}

function _computeConflictItems(state) {
var items = [];
var payload = state.payload, base = state.base, remote = state.remoteData;

Object.keys(payload).forEach(function(sheetName) {
if (sheetName === 'set') return;
var keyFn = CONFLICT_KEY_FNS[sheetName];
if (!keyFn) return;
if (!payload[sheetName]) return;

var localArr = payload[sheetName] || [];
var baseArr = [];
try { baseArr = JSON.parse(base[sheetName] || '[]'); } catch(e) {}
var remoteArr = remote[sheetName] || [];

var baseMap = new Map(), remoteMap = new Map(), localMap = new Map();
baseArr.forEach(function(r)   { baseMap.set(keyFn(r), r); });
remoteArr.forEach(function(r) { remoteMap.set(keyFn(r), r); });
localArr.forEach(function(r)  { localMap.set(keyFn(r), r); });

var allKeys = new Set();
baseMap.forEach(function(_,k)   { allKeys.add(k); });
remoteMap.forEach(function(_,k) { allKeys.add(k); });
localMap.forEach(function(_,k)  { allKeys.add(k); });

allKeys.forEach(function(k) {
var b = baseMap.get(k), l = localMap.get(k), r = remoteMap.get(k);
var bJ = b === undefined ? null : JSON.stringify(b);
var lJ = l === undefined ? null : JSON.stringify(l);
var rJ = r === undefined ? null : JSON.stringify(r);

if (lJ === rJ) return;
if (bJ === lJ) return;
if (bJ === rJ) {
items.push({
sheetName: sheetName, key: k, isConflict: false,
local: l === undefined ? null : l,
remote: r === undefined ? null : r,
summary: _describeConflictItem(sheetName, l, r)
});
return;
}
items.push({
sheetName: sheetName, key: k, isConflict: true,
local: l === undefined ? null : l,
remote: r === undefined ? null : r,
summary: _describeConflictItem(sheetName, l, r)
});
});
});

return items;
}

function _describeConflictItem(sheetName, local, remote) {
var src = local || remote || {};
if (sheetName === 'ap')    return ((local && local.no) ? 'INV-' + local.no : (remote && remote.no) ? 'INV-' + remote.no : 'Antrian') + ' — ' + (src.k || '');
if (sheetName === 'cl')    return (src.n || '?') + ' (' + (src.o || '?') + ')';
if (sheetName === 'ct')    return src.n || '?';
if (sheetName === 'users') return src.n || src.u || '?';
if (sheetName === 'sl')    return 'Transaksi ' + (src.ref || (src.dt + ' Rp' + (src.t || 0)));
if (sheetName === 'ex')    return 'Pengeluaran ' + (src.ket || '?');
if (sheetName === 'md')    return 'Modal ' + (src.dt || '?');
if (sheetName === 'lt')    return src.title || '?';
if (sheetName === 'pos')   return 'Struk ' + (src.no || '?');
return '?';
}

function _shortItem(obj) {
if (obj === null || obj === undefined) return '(dihapus)';
if (typeof obj !== 'object') return String(obj);
var parts = [];
if (obj.n) parts.push(obj.n);

if (conflictItems.length === 0 && safeItems.length === 0) {

function _applyConflictChoices() {
if (!_pendingConflictItems || !_conflictState) { ovClose(); return; }

var conflicts = _pendingConflictItems.conflicts;
var choices = [];

_pendingConflictItems.safe.forEach(function(it) {
choices.push({ item: it, keepLocal: true });
});

conflicts.forEach(function(it, idx) {
var radios = document.getElementsByName('cf' + idx);
var val = 'local';
for (var i = 0; i < radios.length; i++) {
if (radios[i].checked) { val = radios[i].value; break; }
}
choices.push({ item: it, keepLocal: val === 'local' });
});

ovClose();
_showSaveIndicator('💾 Menerapkan...', 'var(--prm)', 0);

var r = _conflictState.remoteData;
D.users = r.users || [];
D.cl    = normalizeClients(r.cl || []);
D.ap    = r.ap    || [];
D.sl    = r.sl    || [];
D.ex    = r.ex    || [];
D.ct    = r.ct    || [];
D.md    = r.md    || [];
D.lt    = r.lt    || [];
D.pos   = r.pos   || [];
(r.set || []).forEach(function(s) {
if (s.k === 'nm' && s.v) D.nm = s.v;
if (s.k === 'wt') { try { D.wt = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || []); } catch(e) {} }
if (s.k === 'dc') { try { D.dc = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || []); } catch(e) {} }
if (s.k === 'cm') { try { D.cm = typeof s.v === 'string' ? JSON.parse(s.v) : (s.v || {}); } catch(e) {} }
if (s.k === 'seq') D.seq = Math.max(D.seq || 0, parseInt(s.v) || 0);
});
D.version = _conflictState.remoteVersion;
_updateLastJSONFromRemote(r);

choices.forEach(function(c) {
if (!c.keepLocal) return;
var arr = D[c.item.sheetName];
if (!arr) return;
var keyFn = CONFLICT_KEY_FNS[c.item.sheetName];
var idx = -1;
for (var i = 0; i < arr.length; i++) {
if (keyFn(arr[i]) === c.item.key) { idx = i; break; }
}
if (c.item.local === null || c.item.local === undefined) {
if (idx >= 0) arr.splice(idx, 1);
} else {
if (idx >= 0) arr[idx] = c.item.local;
else arr.push(c.item.local);
}
});

_conflictState = null;
_pendingConflictItems = null;
syncData();
}

function syncData() {
if (isLocal) return;

const setArr = [
{k:'nm',  v:D.nm},
{k:'wt',  v:JSON.stringify(D.wt || [])},
{k:'dc',  v:JSON.stringify(D.dc || [])},
{k:'cm',  v:JSON.stringify(D.cm || {})},
{k:'seq', v:String(D.seq)}
];

const sheetMap = {
users: D.users, cl: D.cl, ap: D.ap, sl: D.sl, ex: D.ex,
ct: D.ct, md: D.md, lt: D.lt, pos: D.pos
};
const payload = {};
let nothing = true;

for (const k in sheetMap) {
const j = JSON.stringify(sheetMap[k]);
if (_lastJSON[k] !== j) {
payload[k] = sheetMap[k];
_lastJSON[k + '_pending'] = j;
nothing = false;
}
}
const setJ = JSON.stringify(setArr);
if (_lastJSON.set !== setJ) {
payload.set = setArr;
_lastJSON.set_pending = setJ;
nothing = false;
}

if (nothing) return;

if (_syncInFlight) {
if (_syncRetryTimer) clearTimeout(_syncRetryTimer);
_syncRetryTimer = setTimeout(syncData, 500);
return;
}

if (typeof google === 'undefined' || !google.script || !google.script.run) {
_showSaveIndicator('⚠️ Offline — data belum tersimpan', 'var(--warn)', 4000);
return;
}

_syncInFlight = true;
_showSaveIndicator('⏳ Menyimpan...', 'var(--prm)', 0);

google.script.run
.withSuccessHandler((res) => {
_syncInFlight = false;

if (!res || !res.status) {
_showSaveIndicator('❌ Respons kosong dari server', 'var(--red)', 6000);
return;
}

if (res.status === 'conflict') {
_handleConflict(res);
return;
}

if (res.status === 'error') {
_showSaveIndicator('❌ ' + (res.message || 'Gagal menyimpan'), 'var(--red)', 8000);
if (_syncRetryTimer) clearTimeout(_syncRetryTimer);
_syncRetryTimer = setTimeout(syncData, 5000);
return;
}

_clearConflictBackup();
_conflictState = null;
_pendingConflictItems = null;

D.version = res.version;

for (const k in sheetMap) {
if (_lastJSON[k + '_pending'] !== undefined) {
_lastJSON[k] = _lastJSON[k + '_pending'];
delete _lastJSON[k + '_pending'];
}
}
if (_lastJSON.set_pending !== undefined) {
_lastJSON.set = _lastJSON.set_pending;
delete _lastJSON.set_pending;
}

_showSaveIndicator('✅ Tersimpan', 'var(--prm)', 2000);

if (_syncRetryTimer) clearTimeout(_syncRetryTimer);
_syncRetryTimer = setTimeout(syncData, 200);
})
.withFailureHandler((err) => {
_syncInFlight = false;
_showSaveIndicator('❌ Koneksi gagal — mencoba ulang…', 'var(--red)', 4000);
if (_syncRetryTimer) clearTimeout(_syncRetryTimer);
_syncRetryTimer = setTimeout(syncData, 5000);
})
.saveData(payload, D.version);
}

function sortRp(rpArr) {
if(!rpArr || !rpArr.length) return;
rpArr.sort((x,y) => {
const g = o => {
if(typeof o !== 'object') return '0000'; 
if(o.raw) return o.raw; 
if(!o.dt) return '0000';
const m = {'Jan':'01','Feb':'02','Mar':'03','Apr':'04','Mei':'05','Jun':'06','Jul':'07','Agu':'08','Sep':'09','Okt':'10','Nov':'11','Des':'12'};
const p = o.dt.replace(' Pukul ',' ').split(' ');
return (p.length >= 3) ? `${p[2]}-${m[p[1]]||'00'}-${p[0].padStart(2,'0')}T${p[3]||'00:00'}` : o.dt;
};
return g(x).localeCompare(g(y));
});
}

function addToCart() {
const sel = $x('posItem');
if (sel && sel.value === '' && $x('posItemSearch')) {
const q = $x('posItemSearch').value.trim().toLowerCase();
if (q) {
const matches = [];
D.ct.forEach((item, idx) => {
if (item.t === 'p' && (String(item.n || '').toLowerCase() === q || String(item.n || '').toLowerCase().includes(q))) {
matches.push(idx);
}
});
if (matches.length === 1) sel.value = String(matches[0]);
}
}
if (!sel || sel.value === '') {
showAlertDialog('Pilih Barang', 'Silakan ketik dan pilih barang/obat terlebih dahulu dari daftar.');
return;
}

const ix = parseInt(sel.value);
const qty = parseInt($x('posQty').value) || 1;
const c = D.ct[ix];

if (!c) return;

if (c.stk < qty) {
showAlertDialog('Stok Kurang', 'Stok ' + c.n + ' tidak mencukupi. Sisa stok: ' + (c.stk || 0));
return;
}

D.cart = D.cart || [];
const exist = D.cart.find(item => item.n === c.n);
if (exist) {
exist.q += qty;
} else {
D.cart.push({ n: c.n, q: qty, h: c.h, cIdx: ix });
}
renderApp();
}

function updatePosTotal(subtotal) {
const discType = $x('posDiscType').value;
const discInput = $x('posDiscount');
const totalDisplay = $x('posTotalDisplay');
if (!discType || !discInput || !totalDisplay) return;

let discVal = parseFloat(discInput.value) || 0;
let discAmount = 0;

if (discType === '%') {
if (discVal > 100) discVal = 100;
discAmount = subtotal * (discVal / 100);
} else {
discAmount = discVal;
}

if (discAmount < 0) discAmount = 0;
if (discAmount > subtotal) discAmount = subtotal;

const finalTotal = subtotal - discAmount;
totalDisplay.innerHTML = Rp(finalTotal);
}

function checkoutPOS() {
if (!D.cart || D.cart.length === 0) {
showAlertDialog('Keranjang Kosong', 'Belum ada barang yang dimasukkan ke keranjang.');
return;
}

let subtotal = 0;
D.cart.forEach(item => subtotal += (item.h * item.q));

const discType = $x('posDiscType').value;
const discVal = parseFloat($x('posDiscount').value) || 0;
const mtd = $x('posPayMethod').value;

let discAmount = 0;
if (discType === '%') {
let pct = discVal > 100 ? 100 : discVal;
discAmount = subtotal * (pct / 100);
} else {
discAmount = discVal > subtotal ? subtotal : discVal;
}

let finalTotal = subtotal - discAmount;
let discText = discType === '%' ? `(${discVal}%)` : '';

showConfirmDialog('Proses Pembayaran?', `Subtotal: ${Rp(subtotal)}\nDiskon ${discText}: -${Rp(discAmount)}\n\nTotal Bayar: ${Rp(finalTotal)}`, `processCheckoutPOS(${finalTotal}, ${discAmount}, ${subtotal}, '${discType}', ${discVal}, '${mtd}')`);
}

function processCheckoutPOS(total, discAmount, subtotal, discType, discVal, mtd) {
const buyerInput = $x('posBuyer');
const buyer = (buyerInput && buyerInput.value.trim() !== '') ? buyerInput.value.trim() : 'Umum';
const receiptNo = 'POS-' + String(Date.now()).slice(-6) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();

D.cart.forEach(item => {
if (item.cIdx !== undefined && D.ct[item.cIdx]) {
D.ct[item.cIdx].stk = (D.ct[item.cIdx].stk || 0) - item.q;
}
});

D.pos = D.pos || [];
D.pos.push({
no: receiptNo,
dt: da(0),
buyer: buyer,
it: D.cart,
subtotal: subtotal,
disc: discAmount,
discType: discType,
discVal: discVal,
total: total,
m: mtd
});

D.sl.push({ dt: da(0), t: total, m: mtd, ref: 'POS-' + receiptNo });
D.cart = [];

syncData();
ovClose();
renderApp();
showPosInvoice(D.pos.length - 1);
}

function execDelPos(posIdx) {
const p = D.pos[posIdx];
if (!p) { ovClose(); return; }

if (p.it && p.it.length) {
p.it.forEach(item => {
if (item.cIdx !== undefined && D.ct[item.cIdx] && D.ct[item.cIdx].t === 'p') {
D.ct[item.cIdx].stk = (D.ct[item.cIdx].stk || 0) + (item.q || 0);
}
});
}

const refKey = 'POS-' + p.no;
let found = false;
for (let i = D.sl.length - 1; i >= 0; i--) {
if (D.sl[i].ref === refKey) {
D.sl.splice(i, 1);
found = true;
break;
}
}
if (!found) {
for (let i = D.sl.length - 1; i >= 0; i--) {
if (!D.sl[i].ref &&
String(D.sl[i].dt).slice(0, 10) === String(p.dt).slice(0, 10) &&
parseFloat(D.sl[i].t) === parseFloat(p.total) &&
D.sl[i].m === p.m) {
D.sl.splice(i, 1);
break;
}
}
}

D.pos.splice(posIdx, 1);

syncData();
ovClose();
renderApp();
}

function openWA_pos(posIdx) {
const p = D.pos[posIdx];

let phone = "";
if (p.buyer && p.buyer.toLowerCase() !== 'umum') {
const client = D.cl.find(c => String(c.o).toLowerCase() === p.buyer.toLowerCase());
if (client && client.wa) {
phone = client.wa;
}
}

if (!phone) {
const inputPhone = prompt("Nomor WhatsApp pembeli tidak ditemukan. Masukkan nomor WA (contoh: 0812...):");
if (!inputPhone) return;
phone = inputPhone;
}

let numStr = String(phone).trim();
const num = numStr.startsWith('0') ? '62' + numStr.substring(1) : (numStr.startsWith('62') ? numStr : '62' + numStr);

let msg = '*STRUK PENJUALAN - ' + E(D.nm) + '*\n';
msg += 'No: ' + p.no + '\n';
msg += 'Tgl: ' + fD(p.dt) + '\n';
msg += 'Pembeli: ' + (p.buyer || 'Umum') + '\n\n';

p.it.forEach(item => {
msg += '- ' + item.q + 'x ' + item.n + ' : ' + Rp(item.h * item.q) + '\n';
});

msg += '\nSubtotal: ' + Rp(p.subtotal || p.total) + '\n';
if (p.disc) msg += 'Diskon: -' + Rp(p.disc) + '\n';
msg += '*TOTAL: ' + Rp(p.total) + '*\n';
msg += 'Metode: ' + (p.m || 'Tunai') + '\n\n';
msg += 'Terima kasih telah berbelanja!';

const link = 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
window.open(link, '_blank');
}

function normWA(str) {
let s = String(str || '').replace(/\D/g, '');
if (s.startsWith('62')) s = '0' + s.slice(2);
else if (s.startsWith('8')) s = '0' + s;
return s;
}

function updateClTable() {

if (!tbody) return;
const U = D.U;
const rawS = (D.clSearch || '').toLowerCase().trim();
const cleanDigits = rawS.replace(/\D/g, '');
const normSearchWA = normWA(rawS);

function _getBBDoses(c) {
if (!c || !Array.isArray(c.doses)) return [];
return c.doses.filter(d => d && !d._isComm && !d._isEkor && (d.min || d.max || d.title));
}

function _getEkorDoses(c) {
if (!c) return [];
const list = Array.isArray(c.doses) ? c.doses.filter(d => d && d._isEkor && (parseFloat(d.ekor) > 0 || d.ket)) : [];
if (list.length > 0) return list;

function processDelAp(i) {
var a = D.ap[i];
if (!a) { ovClose(); return; }

if (a.payments && a.payments.length > 0) {
a.payments.forEach(pay => {
if (pay.amount < 0 && pay.id) {
const exIdx = D.ex.findIndex(e => e.ref === pay.id);
if (exIdx !== -1) D.ex.splice(exIdx, 1);
}

let idx = -1;
if (pay.id) {
idx = D.sl.findIndex(s => s.ref === pay.id);
}

if (idx === -1 && !pay.id) {
for (let j = 0; j < D.sl.length; j++) {
if (!D.sl[j].ref &&
String(D.sl[j].dt).slice(0,10) === String(pay.date).slice(0,10) &&
parseFloat(D.sl[j].t) === parseFloat(pay.amount) &&
D.sl[j].m === pay.method) {
idx = j;
break;
}
}
}

if (idx !== -1) D.sl.splice(idx, 1);
});
} else if (a.s === 'Selesai') {
var tt = 0;
if (a.it) a.it.forEach(function(itm) { tt += itm.h * itm.q; });
for (var j = D.sl.length - 1; j >= 0; j--) {
if (parseFloat(D.sl[j].t) == tt && D.sl[j].m == a.m) {
D.sl.splice(j, 1);
break;
}
}
}

if (a.it) {
a.it.forEach(function(itm) {
if (itm.cIdx !== undefined && D.ct[itm.cIdx] &&
D.ct[itm.cIdx].t === 'p' && D.ct[itm.cIdx].n === itm.n) {
D.ct[itm.cIdx].stk = (D.ct[itm.cIdx].stk || 0) + itm.q;
}
});
}

D.ap.splice(i, 1);
syncData();
ovClose();
renderApp();
}

var reader = new FileReader();
reader.onload = function(e) {
var img = new Image();
img.onload = function() {
var dim = maxDim || 520;
var qual = quality || 0.55;
var w = img.width, h = img.height;
if (w > h && w > dim) { h = Math.round(h * dim / w); w = dim; }
else if (h > dim) { w = Math.round(w * dim / h); h = dim; }
var canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(img, 0, 0, w, h);
var out = canvas.toDataURL('image/jpeg', qual);
// Pastikan ukuran base64 muat di sel Google Sheets (< 14.000 karakter per foto)
while (out.length > 14000 && dim > 240) {
dim = Math.round(dim * 0.75);
qual = Math.max(0.35, qual - 0.1);
w = img.width; h = img.height;
if (w > h && w > dim) { h = Math.round(h * dim / w); w = dim; }
else if (h > dim) { w = Math.round(w * dim / h); h = dim; }
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(img, 0, 0, w, h);
out = canvas.toDataURL('image/jpeg', qual);
}
resolve(out);
};
img.onerror = reject;
img.src = e.target.result;
};
reader.onerror = reject;
reader.readAsDataURL(file);
});
}

function _applyUploadedPhoto(apIdx, noteIdx, isNew, photoObj) {
_showSaveIndicator('✅ Foto tersimpan', 'var(--prm)', 2000);
if (isNew) {
_pendingPhotos.push(photoObj);
_renderPendingPhotosPreview();
} else {
var a = D.ap[apIdx];
if (!a || !a.nt || !a.nt[noteIdx]) return;
a.nt[noteIdx] = _ntNormalize(a.nt[noteIdx]);
a.nt[noteIdx].photos.push(photoObj);
editNt(apIdx, noteIdx);
}
}

function pickNotePhotos(apIdx, noteIdx, isNew) {
var input = document.createElement('input');
input.type = 'file';
input.accept = 'image/*';
input.onchange = function() {
var file = input.files && input.files[0];
if (!file) return;
_showSaveIndicator('📤 Memproses foto...', 'var(--prm)', 0);
compressImage(file, 520, 0.55).then(function(dataUrl) {
var fallbackId = 'PHOTO_' + Date.now();
if (typeof google === 'undefined' || !google.script || !google.script.run) {
_applyUploadedPhoto(apIdx, noteIdx, isNew, { id: fallbackId, url: dataUrl, thumb: dataUrl });
return;
}
google.script.run
.withSuccessHandler(function(res) {
if (res && res.status === 'success') {
_applyUploadedPhoto(apIdx, noteIdx, isNew, {
id: res.fileId || res.id || fallbackId,
url: res.url || dataUrl,
thumb: res.thumb || res.url || dataUrl
});
} else {
// Fallback otomatis ke penyimpanan langsung di Spreadsheet jika Drive belum diizinkan
_applyUploadedPhoto(apIdx, noteIdx, isNew, { id: fallbackId, url: dataUrl, thumb: dataUrl });
}
})
.withFailureHandler(function() {
_applyUploadedPhoto(apIdx, noteIdx, isNew, { id: fallbackId, url: dataUrl, thumb: dataUrl });
})
.uploadClinicalPhoto(dataUrl, 'clinical_' + Date.now() + '.jpg');
}).catch(function(err) {
_showSaveIndicator('❌ Gagal kompres foto', 'var(--red)', 5000);
console.error(err);
});
};
input.click();
}

function calcRx(i) {

const c = D.ct[ix]; if (!c) { $x('rxR').innerHTML='Pilih obat di atas.'; if(advBox) advBox.style.display='none'; return; }

const pastWt = D.ap.filter(x => x.c == a.c && x.vt && x.vt.length > 0).sort((x,y) => y.dt.localeCompare(x.dt));

const d = parseInt($x('rxD').value) || 5;

if (mode == 'flat' && !hasEkor && hasBB) useBB = true;
if (mode == 'bb' && !hasBB && hasEkor) useBB = false;

if($x('rxSediaan')) $x('rxSediaan').placeholder = (c.mgper || 1) + ' mg';

const tK = parseFloat($x('rxTarget') ? $x('rxTarget').value : NaN);
const tS = parseFloat($x('rxSediaan') ? $x('rxSediaan').value : NaN);

let doseUsed = tK;
if (isNaN(doseUsed)) {
if (bbDoses.length > 0) {
$x('rxR').innerHTML = `<span style="color:var(--warn);font-weight:700;font-size:12px;">⚠️ Silakan pilih Dosis Anjuran dari dropdown atau ketik Target Dosis manual.</span>`;
return;
} else {
doseUsed = (c.mgkg_min + c.mgkg_max) / 2;
}
}
const sediaanUsed = isNaN(tS) ? (c.mgper || 1) : tS;

const dAvg = wt * doseUsed;
const qaExact = dAvg / sediaanUsed;

const mode = $x('rxMode').value;
let useBB = false;
if (mode == 'bb' && hasBB) useBB = true;
if (mode == 'flat' && !hasEkor && hasBB) useBB = true;
if (mode == 'bb' && !hasBB && hasEkor) useBB = false;

const f = parseInt($x('rxF').value) || 2;
const d = parseInt($x('rxD').value) || 5;
let rxStr = '';

const tS = parseFloat($x('rxSediaan') ? $x('rxSediaan').value : NaN);
const doseUsed = isNaN(tK) ? ((c.mgkg_min + c.mgkg_max) / 2) : tK;
const sediaanUsed = isNaN(tS) ? (c.mgper || 1) : tS;

const dAvg = wt * doseUsed; 
const qaExact = dAvg / sediaanUsed;
const qaDisp = parseFloat(qaExact.toFixed(2));

} else if (hasEkor) {
const eSel = $x('rxEkorRule');

const customEkor = parseFloat($x('rxEkorTarget') ? $x('rxEkorTarget').value : NaN);

if (qa <= 0) return;
const ketStr = (selRule && selRule.ket) ? ` [${selRule.ket}]` : '';
totInvoice = Math.ceil(qa * f * d);
rxStr = `Dosis Flat${ketStr}: ${qa} ${c.unit||'unit'}/ekor (${f}x/hr, ${d} hr). Total: ${parseFloat((qa * f * d).toFixed(2))}${freeNote}`;
} else { return; }

a.it = a.it || [];

a.it.forEach(itm => tt += itm.h * itm.q);

if (a.payments) a.payments.forEach(p => alreadyPaid += p.amount);

const dSel = $x('payDisc');
if (dSel && dSel.value !== "" && alreadyPaid === 0) {
const disc = D.dc[parseInt(dSel.value)];
if (disc) {

a.it.push({ n: `Diskon: ${disc.n}`, ni: `Promo / Diskon (${disc.n})`, q: 1, h: -discVal, isDisc: true });

a.payments = [];

function saveCt(ed) {
const n = $x('ctN').value.trim();
const t = $x('ctT').value; 

if (!n) { 
$x('ctN').style.borderColor = 'var(--red)'; 
alert('Nama Internal (Stok/Katalog) wajib diisi!'); 
$x('ctN').focus();
return; 
}

const o = { t: t, n: n, ni: $x('ctNI').value.trim() || n, h: parseInt($x('ctH').value) || 0 }; 

if (t == 'p') {
o.unit = $x('ctUn').value || 'tablet'; 
o.freq = parseInt($x('ctF').value) || 2; 
o.dur = parseInt($x('ctDu').value) || 5;

const pF = (val) => parseFloat(String(val).replace(',', '.')) || 0;

o.mgper = pF($x('ctU2').value);
o.stk = parseInt($x('ctStk').value) || 0;

o.doses = [];
let firstMin = 0;
let firstMax = 0;

const rows = document.querySelectorAll('#doseTableBody tr');
rows.forEach((tr, index) => {
const minEl = tr.querySelector('.d-min');
const maxEl = tr.querySelector('.d-max');
const unitEl = tr.querySelector('.d-unit');
const titleEl = tr.querySelector('.d-title');

if (minEl && maxEl && unitEl && titleEl) {
const minVal = pF(minEl.value);
const maxVal = pF(maxEl.value) || minVal;
const unit = unitEl.value.trim();
const title = titleEl.value.trim();

if (title || minVal > 0 || maxVal > 0) { 
o.doses.push({ min: minVal, max: maxVal, unit, title });

if (firstMin === 0 && (minVal > 0 || maxVal > 0)) {
firstMin = minVal;
firstMax = maxVal;
}
}
}
});

let firstEkor = 0;
const ekorRows = document.querySelectorAll('#ekorTableBody tr');
ekorRows.forEach(tr => {
const valEl = tr.querySelector('.e-val');
const ketEl = tr.querySelector('.e-ket');
if (valEl && ketEl) {
const eVal = pF(valEl.value);
const eKet = ketEl.value.trim();
if (eVal > 0 || eKet) {
o.doses.push({ _isEkor: true, ekor: eVal, ket: eKet });
if (firstEkor === 0 && eVal > 0) firstEkor = eVal;
}
}
});

o.d_ekor = firstEkor;
o.mgkg_min = firstMin;
o.mgkg_max = firstMax > 0 ? firstMax : firstMin;
}

const commObj = _readCtCommForm();
o.comm = commObj;
D.cm = D.cm || {};
if (commObj && (commObj.defVal > 0 || Object.keys(commObj.docs || {}).length > 0)) {
D.cm[o.n] = commObj;
if (t == 's') {
o.doses = [commObj];
}
} else {
delete D.cm[o.n];
if (t == 's') o.doses = [];
}

if (ed >= 0) D.ct[ed] = o; else D.ct.push(o); 
syncData(); ovClose(); renderApp();
}

function getUniqueOwners() {
var map = {};
var list = [];
for (var i = 0; i < D.cl.length; i++) {
var oName = String(D.cl[i].o || '').trim();
var key = oName.toLowerCase();
if (oName && !map[key]) {
map[key] = true;
list.push({ o: oName, wa: D.cl[i].wa || '', firstIdx: i });
}
}
return list;
}

function execDelEx(index) {
const ex = D.ex[index];
if (ex && ex.ref && String(ex.ref).indexOf('COM-') === 0) {
(D.ap || []).forEach(a => {
(a.it || []).forEach(itm => {
if (itm.cmRef === ex.ref) {
delete itm.cmPaid;
delete itm.cmRef;
delete itm.cmDt;
delete itm.cmAmt;
delete itm.cmDoc;
}
});
});
}
D.ex.splice(index, 1);
syncData();
ovClose();
renderApp();
}

function saveDc(ed) {
const n = $x('dcN').value.trim();
const t = $x('dcT').value;
const v = parseFloat($x('dcV').value);

if(!n || isNaN(v) || v <= 0) {
if(!n) $x('dcN').style.borderColor='var(--red)';
if(isNaN(v) || v <= 0) $x('dcV').style.borderColor='var(--red)';
return;
}
if(ed >= 0) { D.dc[ed].n = n; D.dc[ed].t = t; D.dc[ed].v = v; }
else { D.dc.push({n:n, t:t, v:v}); }
syncData(); ovClose(); renderApp();
}

function calcPayDisc() {
const orig = parseFloat($x('payOrigTot').value);
const dSel = $x('payDisc');
let dVal = 0;
if (dSel && dSel.value !== "") {
const disc = D.dc[parseInt(dSel.value)];
if (disc) { dVal = disc.t == '%' ? orig * (disc.v / 100) : disc.v; }
}
if(dVal > orig) dVal = orig;
const finalTot = orig - dVal;
const disp = $x('payTotDisp');
if (disp) {
if (dVal > 0) {
disp.innerHTML = `<div style="font-size:16px;color:var(--text-s);text-decoration:line-through;margin-bottom:4px;font-weight:500">${Rp(orig)}</div>${Rp(finalTot)}`;
} else {
disp.innerHTML = Rp(orig);
}
}
const payAmt = $x('payAmount');
if (payAmt) {
payAmt.value = finalTot > 0 ? finalTot : '';
}
}

function _calcApItemCommission(a, itm) {
if (!itm || itm.isDisc || (parseFloat(itm.h) || 0) <= 0 || (parseFloat(itm.q) || 0) <= 0) {
return { amount: 0, rateLabel: '', hasRule: false };
}
if (itm.cmPaid && itm.cmAmt !== undefined) {
return { amount: parseFloat(itm.cmAmt) || 0, rateLabel: itm.cmRate || 'Tercatat', hasRule: true };
}
let ctItem = null;
if (itm.cIdx !== undefined && D.ct[itm.cIdx] && D.ct[itm.cIdx].n === itm.n) {
ctItem = D.ct[itm.cIdx];
} else {
ctItem = (D.ct || []).find(c => c.n === itm.n || c.ni === itm.n) || null;
}
const cm = _getCtComm(ctItem, itm.n);
if (!cm) return { amount: 0, rateLabel: '', hasRule: false };

const docNameRaw = String((itm.cmDoc || a.d || '')).trim();
const docUser = (D.users || []).find(u =>
String(u.n || '').trim().toLowerCase() === docNameRaw.toLowerCase() ||
String(u.u || '').trim().toLowerCase() === docNameRaw.toLowerCase()
);

let effType = cm.defType || '%';
let effVal = parseFloat(cm.defVal) || 0;

if (cm.docs) {
let specific = null;
if (docUser && cm.docs[docUser.u]) specific = cm.docs[docUser.u];
else if (docUser && cm.docs[docUser.n]) specific = cm.docs[docUser.n];
else if (docNameRaw && cm.docs[docNameRaw]) specific = cm.docs[docNameRaw];

if (specific) {
if (specific.t === 'none') return { amount: 0, rateLabel: '0', hasRule: false };
if (specific.t === '%' || specific.t === 'Rp') {
effType = specific.t;
effVal = parseFloat(specific.v) || 0;
}
}
}

if (effVal <= 0) return { amount: 0, rateLabel: '', hasRule: false };

const subTotal = (parseFloat(itm.h) || 0) * (parseFloat(itm.q) || 1);
let amt = 0;
let rateLabel = '';
if (effType === '%') {
amt = Math.round(subTotal * (effVal / 100));
rateLabel = effVal + '% × ' + Rp(subTotal);
} else {
amt = Math.round(effVal * (parseFloat(itm.q) || 1));
rateLabel = Rp(effVal) + ((parseFloat(itm.q) || 1) > 1 ? ' × ' + itm.q : '');
}
return { amount: amt, rateLabel: rateLabel, hasRule: amt > 0 };
}

function _getAllCommData() {
const docMap = {};
const unassignedList = [];

_getDoctorUsers().forEach(u => {
docMap[u.n] = {
name: u.n,
username: u.u,
unpaidTotal: 0,
unpaidItems: [],
pendingTotal: 0,
pendingItems: [],
paidTotal: 0,
paidItems: []
};
});

(D.ap || []).forEach((a, apIdx) => {
if (!a.it || !Array.isArray(a.it)) return;
const client = D.cl[a.c] || { n: 'Pasien', o: '-' };
a.it.forEach((itm, itmIdx) => {
const calc = _calcApItemCommission(a, itm);
if (!calc.hasRule || calc.amount <= 0) return;

const rawDoc = String(itm.cmDoc || a.d || '').trim();
let matchedDocName = '';
if (rawDoc && rawDoc !== 'Siapa saja') {
const foundU = _getDoctorUsers().find(u =>
String(u.n).toLowerCase() === rawDoc.toLowerCase() ||
String(u.u).toLowerCase() === rawDoc.toLowerCase()
);
matchedDocName = foundU ? foundU.n : rawDoc;
}

const entry = {
apIdx: apIdx,
itmIdx: itmIdx,
dt: a.pDt || a.dt || da(0),
invNo: a.no ? ('INV-' + a.no) : 'Belum Invoice',
petName: client.n || 'Pasien',
ownerName: client.o || '-',
itemName: itm.n,
qty: itm.q || 1,
itemPrice: (itm.h || 0) * (itm.q || 1),
commAmt: calc.amount,
rateLabel: calc.rateLabel,
statusAp: a.s,
cmPaid: !!itm.cmPaid,
cmRef: itm.cmRef || '',
cmDt: itm.cmDt || ''
};

if (!matchedDocName) {
if (a.s === 'Selesai' && !itm.cmPaid) {
unassignedList.push(entry);
}
return;
}

if (!docMap[matchedDocName]) {
docMap[matchedDocName] = {
name: matchedDocName,
username: matchedDocName.toLowerCase(),
unpaidTotal: 0,
unpaidItems: [],
pendingTotal: 0,
pendingItems: [],
paidTotal: 0,
paidItems: []
};
}

if (itm.cmPaid) {
docMap[matchedDocName].paidTotal += calc.amount;
docMap[matchedDocName].paidItems.push(entry);
} else if (a.s === 'Selesai') {
docMap[matchedDocName].unpaidTotal += calc.amount;
docMap[matchedDocName].unpaidItems.push(entry);
} else {
docMap[matchedDocName].pendingTotal += calc.amount;
docMap[matchedDocName].pendingItems.push(entry);
}
});
});

return { docMap: docMap, unassignedList: unassignedList };
}

<p class="t" style="margin:0;font-size:18px">⚙️ Aturan Komisi Item Katalog (Periksa, Rawat Inap, Operasi)</p>
<p style="font-size:12px;color:var(--text-s);margin:4px 0 0">Klik <b>Atur Komisi</b> untuk mengubah nominal (Rp) atau persentase (%) komisi masing-masing dokter pada item tersebut.</p>
</div>
<button class="b bs" style="width:auto;margin:0;padding:8px 14px;font-size:12px;border-radius:99px" onclick="ctForm()">+ Tambah Jasa / Tindakan</button>
</div>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Nama Jasa / Tindakan</th>
<th class="num">Tarif Katalog</th>
<th>Aturan Komisi Dokter Saat Ini</th>
<th class="num">Aksi</th>
</tr>
</thead>
<tbody>
${serviceItems.map(({ c, idx }) => {
const badge = _formatCtCommBadge(c);
return `
<tr>
<td>
<b style="font-size:13px;color:var(--text-m)">${E(c.n)}</b>
<span class="p" style="margin-left:6px;background:var(--bg);color:var(--text-s);font-size:10px">${c.t === 's' ? 'Jasa/Tindakan' : 'Produk'}</span>
</td>
<td class="num" style="font-weight:700">${Rp(c.h)}</td>
<td>${badge || '<span style="font-size:11px;color:var(--text-s)">Belum diatur (0)</span>'}</td>
<td class="num">
<button class="b bs" style="width:auto;display:inline-block;margin:0;padding:6px 12px;font-size:11px;border-radius:6px" onclick="ctForm(${idx})">⚙️ Atur Komisi</button>
</td>
</tr>
`;
}).join('')}
</tbody>
</table>
</div>
</div>
`;

// Riwayat Pembayaran Komisi di Pengeluaran
const commExpenses = (D.ex || []).map((ex, idx) => ({ ex, idx })).filter(x =>
x.ex.k === 'Komisi Dokter' || (x.ex.ref && String(x.ex.ref).indexOf('COM-') === 0)
);
h += `
<div class="c" style="border:none">
<p class="t" style="font-size:18px;margin-bottom:8px">🧾 Riwayat Pembayaran Komisi Dokter (Tercatat di Pengeluaran)</p>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan Pembayaran Komisi</th>
<th>Dicatat Oleh</th>
<th class="num">Nominal Masuk Pengeluaran</th>
<th class="num">Aksi</th>
</tr>
</thead>
<tbody>
${commExpenses.map(({ ex, idx }) => `
<tr>
<td style="font-size:12px;color:var(--text-s)">${fD(ex.dt)}</td>
<td>
<b style="font-size:13px;color:var(--text-m)">${E(ex.ket)}</b>
${ex.ref ? `<br><span style="font-size:10px;color:var(--prm);font-weight:600">Ref: ${E(ex.ref)}</span>` : ''}
</td>
<td><span class="p" style="background:var(--bg);color:var(--text-s)">${E(ex.r || 'admin')}</span></td>
<td class="num red" style="font-size:14px">−${Rp(ex.j)}</td>
<td class="num">
<button onclick="promptDelEx(${idx})" style="padding:6px 10px;background:var(--red-l);border:none;border-radius:6px;cursor:pointer;font-size:11px;color:var(--red);font-weight:600" title="Batalkan & Hapus dari Pengeluaran">🗑️ Batal</button>
</td>
</tr>
`).join('')}
${commExpenses.length === 0 ? `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-s);font-size:13px">Belum ada riwayat pembayaran komisi dokter.</td></tr>` : ''}
</tbody>
</table>
</div>
</div>
`;

return h;
}

function openDocCommModal(docName) {
if (!D.U || D.U.r !== 'admin') {
showAlertDialog('Akses Ditolak', 'Hanya akun Admin yang dapat mengelola dan mencairkan komisi dokter.');
return;
}
const data = _getAllCommData();
const docInfo = data.docMap[docName] || { name: docName, unpaidItems: [], paidItems: [], unpaidTotal: 0, paidTotal: 0 };

let h = `
<div class="h">
<div>
<b style="font-size:18px;color:var(--text-m)">👨‍⚕️ Rincian Komisi: ${E(docInfo.name)}</b>
<p style="font-size:12px;color:var(--text-s);margin:2px 0 0">Pilih tindakan yang akan dibayarkan komisinya. Saat dibayar, otomatis masuk ke <b>Pengeluaran</b>.</p>
</div>
<button onclick="ovClose()" style="border:0;font-size:20px;cursor:pointer;background:none;color:var(--text-s)">✕</button>
</div>
`;

if (docInfo.unpaidItems.length === 0) {
h += `
<div style="background:var(--bg);padding:24px;border-radius:12px;text-align:center;margin:12px 0;border:1px dashed var(--br)">
<div style="font-size:32px;margin-bottom:8px">✅</div>
<b style="font-size:14px;color:var(--text-m)">Tidak Ada Komisi Tertunggak</b>
<p style="font-size:12px;color:var(--text-s);margin:4px 0 0">Semua komisi tindakan selesai untuk <b>${E(docInfo.name)}</b> sudah dibayarkan.</p>
</div>
`;
} else {
h += `
<div style="max-height:320px;overflow-y:auto;border:1px solid var(--br);border-radius:12px;margin-bottom:14px">
<table style="margin:0">
<thead style="position:sticky;top:0;background:var(--bg);z-index:2">
<tr>
<th style="width:32px;text-align:center">
<input type="checkbox" id="cmCheckAll" checked onchange="toggleAllCommChecks(this.checked)" style="width:16px;height:16px;margin:0;cursor:pointer">
</th>
<th>Tgl / Invoice</th>
<th>Pasien & Tindakan</th>
<th class="num">Komisi</th>
</tr>
</thead>
<tbody>
${docInfo.unpaidItems.map((item, idx) => `
<tr>
<td style="text-align:center">
<input type="checkbox" class="cm-pay-chk" data-ap="${item.apIdx}" data-itm="${item.itmIdx}" data-amt="${item.commAmt}" data-label="${E(item.itemName)}" checked onchange="recalcSelectedComm()" style="width:16px;height:16px;margin:0;cursor:pointer">
</td>
<td style="font-size:11px">
${fD(item.dt)}<br>
<b style="color:var(--prm)">${E(item.invNo)}</b>
</td>
<td style="font-size:12px">
<b>${E(item.petName)}</b> <span style="color:var(--text-s)">(${E(item.ownerName)})</span><br>
<span style="color:var(--prm-h);font-weight:600">${E(item.itemName)} (x${item.qty})</span>
<span style="font-size:10px;color:var(--text-s);display:block">Rumus: ${E(item.rateLabel)}</span>
</td>
<td class="num" style="font-weight:700;color:var(--grn);font-size:13px">${Rp(item.commAmt)}</td>
</tr>
`).join('')}
</tbody>
</table>
</div>

<div style="background:var(--prm-l);padding:14px 16px;border-radius:12px;border:1px solid rgba(13,148,136,0.25);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<span style="font-size:13px;font-weight:700;color:var(--prm-h)">Total Komisi Akan Dibayar:</span>
<b id="cmSelectedTotalDisp" style="font-size:20px;color:var(--prm);font-weight:800">${Rp(docInfo.unpaidTotal)}</b>
</div>

<div class="f">
<label>Catatan Pembayaran / Metode (Opsional)</label>
<input id="cmPayNote" placeholder="Cth: Tunai / Transfer BCA">
</div>

<button class="b" style="padding:14px;font-size:14px;border-radius:12px;margin-top:12px" onclick="processPayDoctorComm('${E(docInfo.name)}')">
✓ Bayar Komisi ke ${E(docInfo.name)} & Catat ke Pengeluaran
</button>
`;
}

if (docInfo.paidItems.length > 0) {
h += `
<div style="margin-top:20px;padding-top:16px;border-top:1px dashed var(--br)">
<b style="font-size:13px;color:var(--text-s);display:block;margin-bottom:8px">Riwayat Tindakan yang Sudah Dibayarkan (${docInfo.paidItems.length})</b>
<div style="max-height:180px;overflow-y:auto;border:1px solid var(--br);border-radius:10px">
<table style="margin:0">
${docInfo.paidItems.slice().reverse().map(item => `
<tr>
<td style="font-size:11px;color:var(--text-s)">${fD(item.cmDt || item.dt)}<br><b>${E(item.invNo)}</b></td>
<td style="font-size:12px"><b>${E(item.petName)}</b> — ${E(item.itemName)} (x${item.qty})</td>
<td class="num" style="font-size:12px;color:var(--grn);font-weight:700">✓ ${Rp(item.commAmt)}</td>
</tr>
`).join('')}
</table>
</div>
</div>
`;
}

ov(h);
}

function toggleAllCommChecks(checked) {
document.querySelectorAll('.cm-pay-chk').forEach(chk => { chk.checked = checked; });
recalcSelectedComm();
}

function recalcSelectedComm() {
let total = 0;
document.querySelectorAll('.cm-pay-chk:checked').forEach(chk => {
total += parseFloat(chk.getAttribute('data-amt')) || 0;
});
const disp = $x('cmSelectedTotalDisp');
if (disp) disp.textContent = Rp(total);
}

function processPayDoctorComm(docName) {
if (!D.U || D.U.r !== 'admin') {
showAlertDialog('Akses Ditolak', 'Hanya akun Admin yang dapat mencairkan komisi dokter.');
return;
}
const checked = Array.from(document.querySelectorAll('.cm-pay-chk:checked'));
if (checked.length === 0) {
showAlertDialog('Pilih Tindakan', 'Silakan centang minimal 1 tindakan yang akan dibayarkan komisinya.');
return;
}

let totalAmt = 0;
const itemCounts = {};
const refId = 'COM-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
const today = da(0);
const note = ($x('cmPayNote') ? $x('cmPayNote').value : '').trim();

checked.forEach(chk => {
const apIdx = parseInt(chk.getAttribute('data-ap'));
const itmIdx = parseInt(chk.getAttribute('data-itm'));
const amt = parseFloat(chk.getAttribute('data-amt')) || 0;
const label = chk.getAttribute('data-label') || 'Tindakan';

if (D.ap[apIdx] && D.ap[apIdx].it && D.ap[apIdx].it[itmIdx]) {
const itm = D.ap[apIdx].it[itmIdx];
itm.cmPaid = true;
itm.cmRef = refId;
itm.cmDt = today;
itm.cmAmt = amt;
itm.cmDoc = docName;
totalAmt += amt;
itemCounts[label] = (itemCounts[label] || 0) + (parseFloat(itm.q) || 1);
}
});

if (totalAmt <= 0) return;

const summaryParts = Object.keys(itemCounts).map(k => `${k} x${itemCounts[k]}`);
const ketStr = `Komisi Dokter ${docName}: ${summaryParts.join(', ')}${note ? ' (' + note + ')' : ''}`;

D.ex.unshift({
dt: today,
k: 'Komisi Dokter',
ket: ketStr,
j: totalAmt,
r: 'admin',
ref: refId
});

syncData();
ovClose();
renderApp();
showAlertDialog(
'✅ Komisi Berhasil Dibayarkan',
`Pembayaran komisi untuk ${docName} sebesar ${Rp(totalAmt)} (${checked.length} tindakan) telah berhasil dicatat dan otomatis masuk ke daftar Pengeluaran.`
);
}

</script>
</body>
</html>
